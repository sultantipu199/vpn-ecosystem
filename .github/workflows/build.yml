name: Build Android Release APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Split-per-ABI Release APK
        run: flutter build apk --release --split-per-abi

      - name: Upload arm64-v8a APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-release
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload armeabi-v7a APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-armeabi-v7a-release
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

      - name: Upload all generated APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-all
          path: build/app/outputs/flutter-apk/*.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.1
          name: "VPN Ecosystem v1.0.1 (WiFi & Network Fix)"
          body: |
            ### 🚀 VPN Ecosystem Client v1.0.1
            
            **Resolved Issues:**
            - Fixed WiFi & internet connectivity lock when VPN tunnel starts.
            - Added `allowBypass` & split tunneling routing (`10.8.0.0/24`) so normal WiFi browsing, WhatsApp, YouTube continue working at full speed.
            - Added `onActivityResult` in `MainActivity` for seamless Android VPN permission consent.
            - Added network state and WiFi permissions in `AndroidManifest.xml`.
            
            #### 📱 1-Click Direct Download Links:
            - **[Download APK (ARM64-v8a - Recommended for modern Android phones)](https://github.com/sultantipu199/vpn-ecosystem/releases/download/v1.0.1/app-arm64-v8a-release.apk)** (~7.9 MB)
            - **[Download APK (ARMeabi-v7a - 32-bit older Android phones)](https://github.com/sultantipu199/vpn-ecosystem/releases/download/v1.0.1/app-armeabi-v7a-release.apk)** (~7.4 MB)
            - **[Download APK (x86_64 - Emulators / PC)](https://github.com/sultantipu199/vpn-ecosystem/releases/download/v1.0.1/app-x86_64-release.apk)** (~8.0 MB)
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
